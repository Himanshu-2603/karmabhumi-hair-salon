<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Karmabhumi Hair Salon</title>
<meta name="theme-color" content="#050505">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar"><div class="in">
  <div class="logo" id="logo"></div>
  <h1><span id="title">Karmabhumi Hair Salon</span><small>Owner panel · <span id="dateTxt"></span></small></h1>
  <button class="btn ghost sm" id="openCustomer">Customer<span class="long"> page</span> ↗</button>
</div></div>

<div class="a-wrap">
  <form class="add" id="addForm">
    <input id="newName" maxlength="40" placeholder="Type customer name and press Enter…" autocomplete="off" required>
    <button class="btn" type="submit">+ Add customer</button>
  </form>

  <div class="a-stats">
    <div class="a-stat"><b id="aTotal">0</b><span>Total</span></div>
    <div class="a-stat hot"><b id="aCut">0</b><span>Cutting</span></div>
    <div class="a-stat"><b id="aWait">0</b><span>Pending</span></div>
    <div class="a-stat"><b id="aDone">0</b><span>Done</span></div>
  </div>

  <div class="board">
    <section class="col"><h2>In the chair <em id="eCut">0</em></h2><div id="lCut"></div></section>
    <section class="col"><h2>Waiting <em id="eWait">0</em></h2><div id="lWait"></div></section>
    <section class="col"><h2>Done <em id="eDone">0</em></h2><div id="lDone"></div></section>
  </div>

  <section class="rep">
    <h2>Daily report</h2>
    <p class="s">Pick any date to view that day's customers and export a PDF.</p>
    <div class="bar">
      <input type="date" id="repDate">
      <button class="btn ghost" id="repShow">View</button>
      <button class="btn" id="repPdf">⤓ Export PDF</button>
    </div>
    <div class="chips" id="dayChips"></div>
    <div class="rep-sum" id="repSum"></div>
    <div class="rep-list" id="repList"></div>
  </section>
</div>

<div class="bulk" id="bulk">
  <span class="cnt" id="bulkCnt"></span>
  <button class="btn sm" id="bStart">▶ Start</button>
  <button class="btn sm" id="bDone">✓ Done</button>
  <button class="btn ghost sm" id="bWait">↺ Pending</button>
  <button class="btn ghost sm" id="bClear">Clear</button>
</div>

<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>
<div id="print"></div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
